<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SATs practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF3F1; --card:#FFFFFF; --ink:#12343A; --muted:#4E6A6F; --rule:#CFE0DC;
  --teal:#0E7B7F; --teal-soft:#D3ECEA; --sun:#FFC93C; --sun-soft:#FFF1C7;
  --right:#1D8656; --right-soft:#DDF2E6; --wrong:#C93C3C; --wrong-soft:#FBE3E1;
  --key:#F4F9F8;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1D20; --card:#16282C; --ink:#E4F1EF; --muted:#9DB8B4; --rule:#28403F;
    --teal:#5CC6C9; --teal-soft:#173A3C; --sun:#FFD25E; --sun-soft:#3A3115;
    --right:#5DD39A; --right-soft:#163526; --wrong:#F48A86; --wrong-soft:#3C1E1D; --key:#1C3337;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1D20; --card:#16282C; --ink:#E4F1EF; --muted:#9DB8B4; --rule:#28403F;
  --teal:#5CC6C9; --teal-soft:#173A3C; --sun:#FFD25E; --sun-soft:#3A3115;
  --right:#5DD39A; --right-soft:#163526; --wrong:#F48A86; --wrong-soft:#3C1E1D; --key:#1C3337;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Fredoka","Lexend",system-ui,sans-serif;margin:0;line-height:1.15}
h1{font-size:2.1rem;font-weight:700}
h2{font-size:1.5rem;font-weight:700}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 40px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.btn{appearance:none;border:0;border-radius:14px;background:var(--teal);color:#fff;font-weight:700;padding:12px 22px;min-height:52px;cursor:pointer;font-size:1.05rem}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--rule)}
.btn.sun{background:var(--sun);color:#3B2B00}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{appearance:none;border:0;background:none;color:var(--teal);font-weight:700;padding:8px 0;cursor:pointer;min-height:44px}

/* home */
.hello{margin-bottom:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tile{appearance:none;text-align:left;border:0;border-radius:22px;padding:22px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:8px;min-height:170px}
.tile.maths{background:var(--sun)}
.tile.spell{background:var(--teal-soft)}
.tile .big{font-family:"Fredoka",system-ui,sans-serif;font-size:1.9rem;font-weight:700}
.tile .sym{font-family:"Fredoka",system-ui,sans-serif;font-size:2.6rem;font-weight:700;line-height:1;opacity:.85}
.tile.maths{color:#3B2B00}
.log{margin-top:28px}
.log h2{font-size:1.2rem;margin-bottom:8px}
.log ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:16px;border:1px solid var(--rule)}
.log li{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--rule)}
.log li:first-child{border-top:0}

/* setup */
.panel{background:var(--card);border-radius:20px;padding:20px;border:1px solid var(--rule)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.chip{appearance:none;border:2px solid var(--rule);background:var(--key);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:44px;font-weight:500}
.chip:disabled{opacity:.55;cursor:not-allowed}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}

/* question */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.progress{height:10px;border-radius:5px;background:var(--rule);overflow:hidden;margin-bottom:18px}
.progress div{height:100%;background:var(--teal)}
.qcard{background:var(--card);border-radius:22px;padding:26px 18px;border:1px solid var(--rule);text-align:center}
.qtext{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;font-size:2.2rem;line-height:1.3;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.25em .35em;font-variant-numeric:tabular-nums}
.fr{display:inline-flex;align-items:center;gap:.15em}
.fr .st{display:inline-flex;flex-direction:column;align-items:center;font-size:.8em;line-height:1.05}
.fr .st span:first-child{border-bottom:3px solid currentColor;padding:0 .12em}
.answer{margin:20px auto 0;min-height:66px;max-width:420px;border:3px solid var(--rule);border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-family:"Fredoka",system-ui,sans-serif;font-size:2rem;font-weight:600;background:var(--key);padding:6px 12px;word-break:break-all}
.answer.ph{color:var(--muted);font-size:1.1rem;font-family:"Lexend",system-ui,sans-serif;font-weight:400}
.answer.ok{border-color:var(--right);background:var(--right-soft)}
.answer.no{border-color:var(--wrong);background:var(--wrong-soft)}
.feedback{margin-top:14px;min-height:30px;font-weight:700}
.feedback.ok{color:var(--right)}
.feedback.no{color:var(--wrong)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px auto 0;max-width:420px}
.keypad button{appearance:none;border:2px solid var(--rule);background:var(--card);border-radius:14px;min-height:62px;font-family:"Fredoka",system-ui,sans-serif;font-size:1.6rem;font-weight:600;cursor:pointer;touch-action:manipulation}
.keypad button.wide{grid-column:span 2;font-size:1.05rem;font-family:"Lexend",system-ui,sans-serif}
.keypad button.go{background:var(--teal);color:#fff;border-color:var(--teal);font-size:1.15rem;font-family:"Lexend",system-ui,sans-serif}
.keypad button:active{transform:translateY(1px)}
.hint{margin-top:10px}

/* spelling */
.speak{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.spellin{display:block;width:100%;max-width:420px;margin:20px auto 0;border:3px solid var(--rule);border-radius:16px;background:var(--key);
  padding:14px;font-family:"Lexend",system-ui,sans-serif;font-size:1.7rem;text-align:center}
.spellin.ok{border-color:var(--right);background:var(--right-soft)}
.spellin.no{border-color:var(--wrong);background:var(--wrong-soft)}
.cmp{margin-top:12px;font-size:1.3rem}
.cmp mark{background:var(--sun-soft);color:var(--ink);border-bottom:3px solid var(--sun);padding:0 1px}

/* summary */
.summary{background:var(--card);border-radius:22px;padding:24px;border:1px solid var(--rule)}
.summary .big{font-family:"Fredoka",system-ui,sans-serif;font-size:3.4rem;font-weight:700;line-height:1}
.summary .big span{font-size:1.4rem;color:var(--muted)}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:16px 0}
.summary dt{color:var(--muted)}
.summary dd{margin:0;font-weight:500}
textarea{width:100%;min-height:80px;border:2px solid var(--rule);border-radius:12px;background:var(--key);padding:10px;font:inherit;font-size:1rem}
@media (max-width:480px){
  h1{font-size:1.7rem}
  .qtext{font-size:1.8rem}
  .keypad button{min-height:56px}
}
@media (prefers-reduced-motion:no-preference){
  .progress div{transition:width .3s ease}
}
</style>
</head>
<body>
<div class="wrap"><main id="app"></main></div>
<script>
(function(){
"use strict";
var app=document.getElementById("app");
var KEY_LOG="satsp-log-v1", KEY_WORDS="satsp-words-v1", KEY_EXTRA="satsp-extra-v1";

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function load(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function num(b){var a;do{a=ri(1,b-1);}while(gcd(a,b)!==1);return a;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function nowStr(){var d=new Date();return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+", "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});}

/* ---------- exact fractions ---------- */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a||1;}
function R(n,d){if(d===undefined)d=1;if(d<0){n=-n;d=-d;}var g=gcd(n,d);return {n:n/g,d:d/g};}
function add(a,b){return R(a.n*b.d+b.n*a.d,a.d*b.d);}
function sub(a,b){return R(a.n*b.d-b.n*a.d,a.d*b.d);}
function mul(a,b){return R(a.n*b.n,a.d*b.d);}
function div(a,b){return R(a.n*b.d,a.d*b.n);}
function eq(a,b){return a.n===b.n&&a.d===b.d;}
function dec(str){var p=String(str).split(".");var k=p[1]?p[1].length:0;return R(parseInt(p[0]+(p[1]||""),10),Math.pow(10,k));}
function fmtInt(n){return n.toLocaleString("en-GB");}
function decStr(r){var v=r.n/r.d;var s=v.toFixed(6).replace(/0+$/,"").replace(/\.$/,"");var parts=s.split(".");return fmtInt(parseInt(parts[0],10))+(parts[1]?"."+parts[1]:"");}
function fracStr(r){if(r.d===1)return fmtInt(r.n);var w=Math.floor(r.n/r.d),rem=r.n-w*r.d;return (w?w+" ":"")+rem+"/"+r.d;}
function parseAns(s){
  s=String(s).trim().replace(/,/g,"").replace(/\s+/g," ");
  var m;
  if(/^-?\d+(\.\d+)?$/.test(s))return dec(s);
  if(/^-?\.\d+$/.test(s))return dec(s.replace(".","0."));
  if((m=s.match(/^(\d+)\/(\d+)$/))&&+m[2]>0)return R(+m[1],+m[2]);
  if((m=s.match(/^(\d+) (\d+)\/(\d+)$/))&&+m[3]>0)return R(+m[1]*+m[3]+(+m[2]),+m[3]);
  return null;
}

/* question tokens: strings, or {f:[whole,n,d]} for fractions */
function F(n,d,w){return {f:[w||0,n,d]};}
function tokHTML(t){
  if(typeof t==="string")return "<span>"+esc(t)+"</span>";
  var w=t.f[0],n=t.f[1],d=t.f[2];
  return '<span class="fr">'+(w?"<span>"+w+"</span>":"")+'<span class="st"><span>'+n+'</span><span>'+d+'</span></span></span>';
}
function tokText(t){if(typeof t==="string")return t;return (t.f[0]?t.f[0]+" ":"")+t.f[1]+"/"+t.f[2];}

/* ---------- arithmetic generators ---------- */
var GROUPS={
  addsub:"Adding and subtracting",
  mult:"Multiplying",
  divi:"Dividing",
  decs:"Decimals",
  pct:"Percentages",
  frac:"Fractions",
  order:"Order of operations and powers"
};
function d2(x){return (x/100).toFixed(2);}
function d1(x){return (x/10).toFixed(1);}
var LEVEL=1;
var PACE=[60,57,54,51];
function L(a){return a[LEVEL-1];}
function dp(x,k){var s=(x/Math.pow(10,k)).toFixed(k);return s.indexOf(".")>=0?s.replace(/\.?0+$/,""):s;}
function distinctPair(pool){var b=pick(pool),d;do{d=pick(pool);}while(d===b);return [b,d];}
function fr(n,d,w){return R((w||0)*d+n,d);}
var GENS=[
  {g:"addsub",name:"Adding whole numbers",make:function(){
    var top=L([99999,999999,999999,9999999]);var a=ri(1000,top),b=ri(100,top);
    if(LEVEL>=3){var c=ri(1000,L([0,0,99999,999999]));return {q:[fmtInt(a),"+",fmtInt(b),"+",fmtInt(c),"="],ans:R(a+b+c)};}
    return {q:[fmtInt(a),"+",fmtInt(b),"="],ans:R(a+b)};}},
  {g:"addsub",name:"Subtracting whole numbers",make:function(){
    var a;
    if(LEVEL===1)a=ri(10000,99999);else if(LEVEL===2)a=ri(100000,999999);
    else if(LEVEL===3)a=ri(1,9)*100000+ri(0,9)*1000;else a=ri(1,9)*1000000+ri(0,9)*10000;
    var b=ri(Math.floor(a/10),a-1);return {q:[fmtInt(a),"−",fmtInt(b),"="],ans:R(a-b)};}},
  {g:"addsub",name:"Missing numbers",make:function(){
    var a=ri(1000,L([9999,99999,999999,9999999])),b=ri(100,a-1);
    return Math.random()<.5?{q:["□","−",fmtInt(b),"=",fmtInt(a)],ans:R(a+b)}:{q:[fmtInt(b),"+","□","=",fmtInt(a)],ans:R(a-b)};}},
  {g:"decs",name:"Adding decimals",make:function(){
    var A,B,C;
    if(LEVEL===1){A=dp(ri(100,9999),2);B=dp(ri(10,999),1);}
    else if(LEVEL===2){A=dp(ri(1000,99999),2);B=dp(ri(100,9999),2);}
    else if(LEVEL===3){A=dp(ri(1000,99999),3);B=dp(ri(10,999),1);}
    else{A=dp(ri(1000,99999),3);B=dp(ri(100,9999),2);C=String(ri(2,99));
      return {q:[A,"+",B,"+",C,"="],ans:add(add(dec(A),dec(B)),dec(C)),asDec:true};}
    return {q:[A,"+",B,"="],ans:add(dec(A),dec(B)),asDec:true};}},
  {g:"decs",name:"Subtracting decimals",make:function(){
    var A,B,a;
    if(LEVEL===1){a=ri(100,999);A=dp(a,1);B=dp(ri(10,a*10-1),2);}
    else if(LEVEL===2){a=ri(10,99);A=String(a);B=dp(ri(100,a*100-1),2);}
    else if(LEVEL===3){a=ri(1000,9999);A=dp(a,2);B=dp(ri(100,a*10-1),3);}
    else{a=ri(10,999);A=String(a);B=dp(ri(1000,a*1000-1),3);}
    return {q:[A,"−",B,"="],ans:sub(dec(A),dec(B)),asDec:true};}},
  {g:"decs",name:"Multiplying and dividing by 10, 100, 1000",make:function(){
    var x=dp(ri(1,L([9999,99999,99999,99999])),L([2,3,3,3]));
    var p=pick(L([[10,100,1000],[10,100,1000],[100,1000],[1000]]));
    var op=Math.random()<.5?"×":"÷";var X=dec(x);
    var res=op==="×"?mul(X,R(p)):div(X,R(p));
    if(LEVEL>=3&&Math.random()<.5)return {q:["□",op,fmtInt(p),"=",decStr(res)],ans:X,asDec:true};
    return {q:[x,op,fmtInt(p),"="],ans:res,asDec:true};}},
  {g:"decs",name:"Decimal times a whole number",make:function(){
    var x,k;
    if(LEVEL===1){x=dp(ri(101,999),2);k=ri(3,9);}
    else if(LEVEL===2){x=dp(ri(1001,9999),2);k=ri(3,9);}
    else if(LEVEL===3){x=dp(ri(11,999),1);k=ri(12,39);}
    else{x=dp(ri(101,999),2);k=ri(12,49);}
    return {q:[x,"×",String(k),"="],ans:mul(dec(x),R(k)),asDec:true};}},
  {g:"mult",name:"Short multiplication",make:function(){
    var r=L([[1000,9999],[10000,99999],[10000,99999],[100000,999999]]);var a=ri(r[0],r[1]),b=LEVEL>=3?ri(6,9):ri(3,9);
    return {q:[fmtInt(a),"×",String(b),"="],ans:R(a*b)};}},
  {g:"mult",name:"Long multiplication",make:function(){
    var a,b;
    if(LEVEL===1){a=Math.random()<.5?ri(120,999):ri(1000,4999);b=ri(12,89);}
    else if(LEVEL===2){a=ri(1000,4999);b=ri(12,89);}
    else if(LEVEL===3){a=ri(1000,9999);b=ri(40,99);}
    else{a=ri(5000,9999);b=ri(60,99);}
    return {q:[fmtInt(a),"×",String(b),"="],ans:R(a*b)};}},
  {g:"divi",name:"Short division",make:function(){
    var d,q,t,r;
    if(LEVEL<=2){d=ri(3,9);q=LEVEL===1?ri(100,2999):ri(1000,9999);return {q:[fmtInt(d*q),"÷",String(d),"="],ans:R(q)};}
    q=ri(100,1999);
    if(LEVEL===3){d=pick([2,4,5,6,8]);t=d===5?pick([2,4,6,8]):5;r=t*d/10;return {q:[fmtInt(d*q+r),"÷",String(d),"="],ans:R(10*q+t,10),asDec:true};}
    d=pick([4,8]);t=pick([25,50,75]);r=t*d/100;return {q:[fmtInt(d*q+r),"÷",String(d),"="],ans:R(100*q+t,100),asDec:true};}},
  {g:"divi",name:"Long division",make:function(){
    var d,q;
    if(LEVEL===1){d=ri(12,49);q=Math.random()<.6?ri(11,99):ri(101,299);}
    else if(LEVEL===2){d=ri(12,99);q=ri(101,499);}
    else if(LEVEL===3){d=ri(21,99);q=ri(101,999);}
    else{d=ri(51,99);q=ri(201,999);}
    return {q:[fmtInt(d*q),"÷",String(d),"="],ans:R(q)};}},
  {g:"pct",name:"Percentages of amounts",make:function(){
    var p,N;
    if(LEVEL===1){p=pick([1,5,10,15,20,25,30,35,40,50,60,75,90]);
      if(p===1)N=100*ri(2,40);else if(p===25||p===75)N=4*ri(10,120);else if(p%10===0)N=10*ri(4,90);else N=20*ri(2,45);}
    else if(LEVEL===2){p=pick([5,12,15,24,35,45,55,65,85,95]);N=10*ri(4,90);}
    else if(LEVEL===3){p=ri(2,99);N=10*ri(4,90);}
    else{p=ri(2,99);N=ri(101,999);}
    return {q:[p+"%","of",fmtInt(N),"="],ans:R(p*N,100),asDec:true};}},
  {g:"frac",name:"Adding fractions",make:function(){
    var b,d,a,c,w1=0,w2=0;
    if(LEVEL===1){
      b=pick([2,3,4,5,6]);d=b*pick([2,3]);a=num(b);c=num(d);
      if(Math.random()<.35)w1=ri(1,3);
      else if(Math.random()<.4){b=pick([2,3,4,5]);d=pick([3,5,7].filter(function(x){return x!==b;}));a=num(b);c=num(d);}
    } else if(LEVEL===2){var pr=distinctPair([2,3,4,5,6,7,8,9]);b=pr[0];d=pr[1];a=num(b);c=num(d);}
    else if(LEVEL===3){b=pick([2,3,4,5,6]);d=b*pick([2,3]);a=num(b);c=num(d);w1=ri(1,4);w2=ri(1,4);}
    else{var p2=distinctPair([3,4,5,6,7,8,9]);b=p2[0];d=p2[1];a=num(b);c=num(d);w1=ri(1,5);w2=ri(1,5);}
    return {q:[F(a,b,w1),"+",F(c,d,w2),"="],ans:add(fr(a,b,w1),fr(c,d,w2)),asFrac:true};}},
  {g:"frac",name:"Subtracting fractions",make:function(){
    var b,d,a,c,w1=0,w2=0,x,y;
    if(LEVEL===1){b=pick([2,3,4,5,6]);d=b*pick([2,3]);a=num(b);c=num(d);
      x=R(a,b);y=R(c,d);
      if(x.n*y.d<=y.n*x.d)return {q:[F(c,d,1),"−",F(a,b),"="],ans:sub(R(d+c,d),R(a,b)),asFrac:true};
      return {q:[F(a,b),"−",F(c,d),"="],ans:sub(x,y),asFrac:true};}
    if(LEVEL===2){var pr=distinctPair([2,3,4,5,6,7,8,9]);b=pr[0];d=pr[1];}
    else if(LEVEL===3){b=pick([2,3,4,5,6]);d=b*pick([2,3]);}
    else{var p2=distinctPair([3,4,5,6,7,8,9]);b=p2[0];d=p2[1];}
    a=num(b);c=num(d);
    if(LEVEL>=3){w1=ri(2,6);w2=ri(1,w1-1);}
    x=fr(a,b,w1);y=fr(c,d,w2);
    if(LEVEL===2&&x.n*y.d<=y.n*x.d){var t1=a;a=c;c=t1;t1=b;b=d;d=t1;x=fr(a,b);y=fr(c,d);}
    return {q:[F(a,b,w1),"−",F(c,d,w2),"="],ans:sub(x,y),asFrac:true};}},
  {g:"frac",name:"Multiplying fractions",make:function(){
    var a,b,c,d,k,w;
    if(LEVEL===1){

var synth=window.speechSynthesis||null;

function pickVoice(){
  if(!synth)return;
  var vs=synth.getVoices()||[];
  voice=vs.find(function(v){return v.lang==="en-GB";})||vs.find(function(v){return /^en/.test(v.lang);})||null;
}
if(synth){pickVoice();try{synth.onvoiceschanged=pickVoice;}catch(e){}}
function say(parts){
  if(!synth)return false;

  parts.forEach(function(t){
    var u=new SpeechSynthesisUtterance(t);

    synth.speak(u);

  return true;

function arithKey(k){

function spellPick(){
  var prog=load(KEY_WORDS,{}),now=Date.now();
  var words=allWords();
  var due=[],fresh=[],later=[];
  words.forEach(function(w){var p=prog[w[0]];if(!p)fresh.push(w);else if(p.due<=now)due.push(w);else later.push(w);});
  due.sort(function(a,b){return prog[a[0]].box-prog[b[0]].box;});
  shuffle(fresh);
  later.sort(function(a,b){return prog[a[0]].due-prog[b[0]].due;});
  var dueTake=due.slice(0,7);
  return shuffle(dueTake.concat(fresh.slice(0,10-dueTake.length)).concat(later).slice(0,10));
}
function spellStart(){
  S={view:"spell",items:spellPick(),i:0,right:0,missed:[],checked:false};

function markDiff(typed,target){
  var out="";for(var i=0;i<target.length;i++){var c=target[i];out+=(typed[i]===c)?esc(c):"<mark>"+esc(c)+"</mark>";}return out;
}
function spellCheck(){
  var inp=document.getElementById("sp");

  var typed=inp.value.trim().toLowerCase();
  if(!typed)return;

  p.seen++;

  if(ok){fb.textContent=pick(["Correct.","Spot on.","Yes, that's right."]);fb.className="feedback ok";}

    document.getElementById("cmp").innerHTML=markDiff(typed,w[0]);}

function spellNext(){
  S.i++;S.checked=false;
  if(S.i>=S.items.length)spellDone();else spellDraw();
}
function spellDone(){
  var when=nowStr(),n=S.items.length;
  logSession({kind:"Spelling",when:when,score:S.right,total:n,missed:S.missed});
  S.view="spell-done";
  app.innerHTML='<div class="summary"><p class="muted">Spelling, '+esc(when)+'</p>'+
    '<p class="big" style="margin-top:8px">'+S.right+'<span> / '+n+'</span></p>'+
    '<dl><dt>To learn</dt><dd>'+(S.missed.length?S.missed.map(esc).join(", "):"Nothing missed")+'</dd></dl>'+
    '<p class="muted small">Take a screenshot and send it to Dad. These words will come back in your next sessions.</p></div>'+
    '<div class="row" style="margin-top:16px"><button class="btn" data-act="spell-go">Another 10</button><button class="btn alt" data-act="home">Done</button></div>';
}

/* ---------- events ---------- */
app.addEventListener("click",function(e){
  var k=e.target.closest("[data-key]");
  if(k){arithKey(k.dataset.key);return;}
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.dataset.act;
  if(a==="home")home();
  else if(a==="arith-setup")arithSetup();
  else if(a==="chip"){
    var g=el.dataset.g,i=chosen.indexOf(g);
    if(i>=0){if(chosen.length>1)chosen.splice(i,1);}else chosen.push(g);
    store("satsp-groups-v1",chosen);
    el.setAttribute("aria-pressed",String(chosen.indexOf(g)>=0));
  }
  else if(a==="level"){curLevel=+el.dataset.l;store("satsp-level-v1",curLevel);arithSetup();}
  else if(a==="arith-go")arithStart(+el.dataset.n);
  else if(a==="arith-redo")arithStart(Math.max(10,S.redo.length*3),S.redo);
  else if(a==="spell-setup")spellSetup();
  else if(a==="spell-go")spellStart();
  else if(a==="hear"){var w=S.items[S.i];say(w[1]?[w[0],w[1],w[0]]:[w[0],w[0]]);var i2=document.getElementById("sp");if(i2&&!S.checked)i2.focus();}
  else if(a==="hear-word"){say([S.items[S.i][0]]);}
  else if(a==="spell-check")spellCheck();
  else if(a==="extra-save"){
    var list=document.getElementById("extra").value.split(/[,\n]/).map(function(s){return s.trim().toLowerCase();})
      .filter(function(s){return /^[a-z][a-z' -]*$/.test(s);});
    var known=WORDS.map(function(w){return w[0];});
    list=list.filter(function(s,i){return list.indexOf(s)===i&&known.indexOf(s)<0;});
    store(KEY_EXTRA,list);
    document.getElementById("exmsg").textContent=list.length?"Saved "+list.length+" word"+(list.length===1?"":"s")+".":"Saved.";
  }
});
document.addEventListener("keydown",function(e){
  if(S.view==="arith"){
    if(/^[0-9.\/ ]$/.test(e.key)){e.preventDefault();arithKey(e.key);}
    else if(e.key==="Backspace"){e.preventDefault();arithKey("back");}
    else if(e.key==="Enter"){e.preventDefault();arithKey("enter");}
  } else if(S.view==="spell"&&e.key==="Enter"){e.preventDefault();spellCheck();}
});

home();
})();
</script>
</body>
</html>
