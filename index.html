<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SATs practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF3F1; --card:#FFFFFF; --ink:#12343A; --muted:#4E6A6F; --rule:#CFE0DC;
  --teal:#0E7B7F; --teal-soft:#D3ECEA; --sun:#FFC93C; --sun-soft:#FFF1C7;
  --right:#1D8656; --right-soft:#DDF2E6; --wrong:#C93C3C; --wrong-soft:#FBE3E1;
  --key:#F4F9F8;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1D20; --card:#16282C; --ink:#E4F1EF; --muted:#9DB8B4; --rule:#28403F;
    --teal:#5CC6C9; --teal-soft:#173A3C; --sun:#FFD25E; --sun-soft:#3A3115;
    --right:#5DD39A; --right-soft:#163526; --wrong:#F48A86; --wrong-soft:#3C1E1D; --key:#1C3337;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1D20; --card:#16282C; --ink:#E4F1EF; --muted:#9DB8B4; --rule:#28403F;
  --teal:#5CC6C9; --teal-soft:#173A3C; --sun:#FFD25E; --sun-soft:#3A3115;
  --right:#5DD39A; --right-soft:#163526; --wrong:#F48A86; --wrong-soft:#3C1E1D; --key:#1C3337;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Fredoka","Lexend",system-ui,sans-serif;margin:0;line-height:1.15}
h1{font-size:2.1rem;font-weight:700}
h2{font-size:1.5rem;font-weight:700}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 40px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.btn{appearance:none;border:0;border-radius:14px;background:var(--teal);color:#fff;font-weight:700;padding:12px 22px;min-height:52px;cursor:pointer;font-size:1.05rem}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--rule)}
.btn.sun{background:var(--sun);color:#3B2B00}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{appearance:none;border:0;background:none;color:var(--teal);font-weight:700;padding:8px 0;cursor:pointer;min-height:44px}

/* home */
.hello{margin-bottom:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tile{appearance:none;text-align:left;border:0;border-radius:22px;padding:22px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:8px;min-height:170px}
.tile.maths{background:var(--sun)}
.tile.spell{background:var(--teal-soft)}
.tile .big{font-family:"Fredoka",system-ui,sans-serif;font-size:1.9rem;font-weight:700}
.tile .sym{font-family:"Fredoka",system-ui,sans-serif;font-size:2.6rem;font-weight:700;line-height:1;opacity:.85}
.tile.maths{color:#3B2B00}
.log{margin-top:28px}
.log h2{font-size:1.2rem;margin-bottom:8px}
.log ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:16px;border:1px solid var(--rule)}
.log li{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--rule)}
.log li:first-child{border-top:0}

/* setup */
.panel{background:var(--card);border-radius:20px;padding:20px;border:1px solid var(--rule)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.chip{appearance:none;border:2px solid var(--rule);background:var(--key);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:44px;font-weight:500}
.chip:disabled{opacity:.55;cursor:not-allowed}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}

/* question */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.progress{height:10px;border-radius:5px;background:var(--rule);overflow:hidden;margin-bottom:18px}
.progress div{height:100%;background:var(--teal)}
.qcard{background:var(--card);border-radius:22px;padding:26px 18px;border:1px solid var(--rule);text-align:center}
.qtext{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;font-size:2.2rem;line-height:1.3;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.25em .35em;font-variant-numeric:tabular-nums}
.fr{display:inline-flex;align-items:center;gap:.15em}
.fr .st{display:inline-flex;flex-direction:column;align-items:center;font-size:.8em;line-height:1.05}
.fr .st span:first-child{border-bottom:3px solid currentColor;padding:0 .12em}
.answer{margin:20px auto 0;min-height:66px;max-width:420px;border:3px solid var(--rule);border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-family:"Fredoka",system-ui,sans-serif;font-size:2rem;font-weight:600;background:var(--key);padding:6px 12px;word-break:break-all}
.answer.ph{color:var(--muted);font-size:1.1rem;font-family:"Lexend",system-ui,sans-serif;font-weight:400}
.answer.ok{border-color:var(--right);background:var(--right-soft)}
.answer.no{border-color:var(--wrong);background:var(--wrong-soft)}
.feedback{margin-top:14px;min-height:30px;font-weight:700}
.feedback.ok{color:var(--right)}
.feedback.no{color:var(--wrong)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px auto 0;max-width:420px}
.keypad button{appearance:none;border:2px solid var(--rule);background:var(--card);border-radius:14px;min-height:62px;font-family:"Fredoka",system-ui,sans-serif;font-size:1.6rem;font-weight:600;cursor:pointer;touch-action:manipulation}
.keypad button.wide{grid-column:span 2;font-size:1.05rem;font-family:"Lexend",system-ui,sans-serif}
.keypad button.go{background:var(--teal);color:#fff;border-color:var(--teal);font-size:1.15rem;font-family:"Lexend",system-ui,sans-serif}
.keypad button:active{transform:translateY(1px)}
.hint{margin-top:10px}
.keypad button.full{grid-column:1/-1}
.rtext{font-size:1.25rem;line-height:1.55;text-align:left;margin:0}
.unit{margin-top:8px}
.tile.course{background:var(--teal);color:#fff;grid-column:1/-1;min-height:140px}
.tile.course .sym{opacity:1}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.daycell{appearance:none;text-align:left;border:2px solid var(--rule);background:var(--card);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px;font-size:.92rem}
.daycell.done{border-color:var(--right);background:var(--right-soft)}
.daycell.now{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}
.daycell:disabled{opacity:.45;cursor:not-allowed}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:16px}
.step .sbody{flex:1;min-width:0}
.step .snum{flex:0 0 44px;height:44px;border-radius:50%;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;font-family:"Fredoka",system-ui,sans-serif;font-weight:700;font-size:1.3rem}
.step.sdone .snum{background:var(--right);color:#fff}
.qline{font-size:1.15rem;font-weight:500}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{appearance:none;text-align:left;border:2px solid var(--rule);background:var(--key);border-radius:14px;padding:12px 14px;min-height:52px;cursor:pointer;font-size:1.02rem}
.opt.right{border-color:var(--right);background:var(--right-soft)}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.ctx{background:var(--sun-soft);border-radius:16px;padding:16px;margin-bottom:12px}
.ctx h3{margin-bottom:8px}
.ctx p{margin-top:6px;font-size:.98rem}
.ords{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.ordcard{appearance:none;text-align:left;display:flex;gap:12px;align-items:flex-start;border:2px solid var(--rule);background:var(--key);border-radius:14px;padding:12px;cursor:pointer;font-size:1rem;color:var(--ink)}
.ordcard .badge{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--rule);display:flex;align-items:center;justify-content:center;font-family:"Fredoka",system-ui,sans-serif;font-weight:700}
.ordcard.picked{border-color:var(--teal)}
.ordcard.picked .badge{background:var(--teal);border-color:var(--teal);color:#fff}
.ordcard.right{border-color:var(--right);background:var(--right-soft)}
.ordcard.wrong{border-color:var(--wrong);background:var(--wrong-soft)}
.ordcard:disabled{cursor:default}
.rightorder{margin:10px 0 0;padding-left:22px}
.rightorder li{margin-top:6px}
.planbox{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-weight:500;font-size:.95rem}
.planbox textarea{min-height:56px}
.tick{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--rule);cursor:pointer}
.tick input{width:26px;height:26px;flex:0 0 26px;margin:0;accent-color:var(--teal)}
.timer{font-family:"Fredoka",system-ui,sans-serif;font-size:1.4rem;font-weight:600}
@media (max-width:560px){.step{flex-wrap:wrap}.step .btn{width:100%}}

/* spelling */
.speak{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.spellin{display:block;width:100%;max-width:420px;margin:20px auto 0;border:3px solid var(--rule);border-radius:16px;background:var(--key);
  padding:14px;font-family:"Lexend",system-ui,sans-serif;font-size:1.7rem;text-align:center}
.spellin.ok{border-color:var(--right);background:var(--right-soft)}
.spellin.no{border-color:var(--wrong);background:var(--wrong-soft)}
.cmp{margin-top:12px;font-size:1.3rem}
.cmp mark{background:var(--sun-soft);color:var(--ink);border-bottom:3px solid var(--sun);padding:0 1px}

/* summary */
.summary{background:var(--card);border-radius:22px;padding:24px;border:1px solid var(--rule)}
.summary .big{font-family:"Fredoka",system-ui,sans-serif;font-size:3.4rem;font-weight:700;line-height:1}
.summary .big span{font-size:1.4rem;color:var(--muted)}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:16px 0}
.summary dt{color:var(--muted)}
.summary dd{margin:0;font-weight:500}
textarea{width:100%;min-height:80px;border:2px solid var(--rule);border-radius:12px;background:var(--key);padding:10px;font:inherit;font-size:1rem}
@media (max-width:480px){
  h1{font-size:1.7rem}
  .qtext{font-size:1.8rem}
  .keypad button{min-height:56px}
}
@media (prefers-reduced-motion:no-preference){
  .progress div{transition:width .3s ease}
}
</style>
</head>
<body>
<div class="wrap"><main id="app"></main></div>
<script>
(function(){
"use strict";
var app=document.getElementById("app");
var KEY_LOG="satsp-log-v1", KEY_WORDS="satsp-words-v1", KEY_EXTRA="satsp-extra-v1";

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function load(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function num(b){var a;do{a=ri(1,b-1);}while(gcd(a,b)!==1);return a;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function nowStr(){var d=new Date();return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+", "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});}

/* ---------- exact fractions ---------- */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a||1;}
function R(n,d){if(d===undefined)d=1;if(d<0){n=-n;d=-d;}var g=gcd(n,d);return {n:n/g,d:d/g};}
function add(a,b){return R(a.n*b.d+b.n*a.d,a.d*b.d);}
function sub(a,b){return R(a.n*b.d-b.n*a.d,a.d*b.d);}
function mul(a,b){return R(a.n*b.n,a.d*b.d);}
function div(a,b){return R(a.n*b.d,a.d*b.n);}
function eq(a,b){return a.n===b.n&&a.d===b.d;}
function dec(str){var p=String(str).split(".");var k=p[1]?p[1].length:0;return R(parseInt(p[0]+(p[1]||""),10),Math.pow(10,k));}
function fmtInt(n){return n.toLocaleString("en-GB");}
function decStr(r){var v=r.n/r.d;var s=v.toFixed(6).replace(/0+$/,"").replace(/\.$/,"");var parts=s.split(".");return fmtInt(parseInt(parts[0],10))+(parts[1]?"."+parts[1]:"");}
function fracStr(r){if(r.d===1)return fmtInt(r.n);var w=Math.floor(r.n/r.d),rem=r.n-w*r.d;return (w?w+" ":"")+rem+"/"+r.d;}
function parseAns(s){
  s=String(s).trim().replace(/[−–]/g,"-").replace(/,/g,"").replace(/\s+/g," ");
  var m;
  if(/^-?\d+(\.\d+)?$/.test(s))return dec(s);
  if(/^-?\.\d+$/.test(s))return dec(s.replace(".","0."));
  if((m=s.match(/^(\d+)\/(\d+)$/))&&+m[2]>0)return R(+m[1],+m[2]);
  if((m=s.match(/^(\d+) (\d+)\/(\d+)$/))&&+m[3]>0)return R(+m[1]*+m[3]+(+m[2]),+m[3]);
  return null;
}

/* question tokens: strings, or {f:[whole,n,d]} for fractions */
function F(n,d,w){return {f:[w||0,n,d]};}
function tokHTML(t){
  if(typeof t==="string")return "<span>"+esc(t)+"</span>";
  var w=t.f[0],n=t.f[1],d=t.f[2];
  return '<span class="fr">'+(w?"<span>"+w+"</span>":"")+'<span class="st"><span>'+n+'</span><span>'+d+'</span></span></span>';
}
function tokText(t){if(typeof t==="string")return t;return (t.f[0]?t.f[0]+" ":"")+t.f[1]+"/"+t.f[2];}

/* ---------- arithmetic generators ---------- */
var GROUPS={
  addsub:"Adding and subtracting",
  mult:"Multiplying",
  divi:"Dividing",
  decs:"Decimals",
  pct:"Percentages",
  frac:"Fractions",
  order:"Order of operations and powers"
};
function d2(x){return (x/100).toFixed(2);}
function d1(x){return (x/10).toFixed(1);}
var LEVEL=1;
var PACE=[60,57,54,51];
function L(a){return a[LEVEL-1];}
function dp(x,k){var s=(x/Math.pow(10,k)).toFixed(k);return s.indexOf(".")>=0?s.replace(/\.?0+$/,""):s;}
function distinctPair(pool){var b=pick(pool),d;do{d=pick(pool);}while(d===b);return [b,d];}
function fr(n,d,w){return R((w||0)*d+n,d);}
var GENS=[
  {g:"addsub",name:"Adding whole numbers",make:function(){
    var top=L([99999,999999,999999,9999999]);var a=ri(1000,top),b=ri(100,top);
    if(LEVEL>=3){var c=ri(1000,L([0,0,99999,999999]));return {q:[fmtInt(a),"+",fmtInt(b),"+",fmtInt(c),"="],ans:R(a+b+c)};}
    return {q:[fmtInt(a),"+",fmtInt(b),"="],ans:R(a+b)};}},
  {g:"addsub",name:"Subtracting whole numbers",make:function(){
    var a;
    if(LEVEL===1)a=ri(10000,99999);else if(LEVEL===2)a=ri(100000,999999);
    else if(LEVEL===3)a=ri(1,9)*100000+ri(0,9)*1000;else a=ri(1,9)*1000000+ri(0,9)*10000;
    var b=ri(Math.floor(a/10),a-1);return {q:[fmtInt(a),"−",fmtInt(b),"="],ans:R(a-b)};}},
  {g:"addsub",name:"Missing numbers",make:function(){
    var a=ri(1000,L([9999,99999,999999,9999999])),b=ri(100,a-1);
    return Math.random()<.5?{q:["□","−",fmtInt(b),"=",fmtInt(a)],ans:R(a+b)}:{q:[fmtInt(b),"+","□","=",fmtInt(a)],ans:R(a-b)};}},
  {g:"decs",name:"Adding decimals",make:function(){
    var A,B,C;
    if(LEVEL===1){A=dp(ri(100,9999),2);B=dp(ri(10,999),1);}
    else if(LEVEL===2){A=dp(ri(1000,99999),2);B=dp(ri(100,9999),2);}
    else if(LEVEL===3){A=dp(ri(1000,99999),3);B=dp(ri(10,999),1);}
    else{A=dp(ri(1000,99999),3);B=dp(ri(100,9999),2);C=String(ri(2,99));
      return {q:[A,"+",B,"+",C,"="],ans:add(add(dec(A),dec(B)),dec(C)),asDec:true};}
    return {q:[A,"+",B,"="],ans:add(dec(A),dec(B)),asDec:true};}},
  {g:"decs",name:"Subtracting decimals",make:function(){
    var A,B,a;
    if(LEVEL===1){a=ri(100,999);A=dp(a,1);B=dp(ri(10,a*10-1),2);}
    else if(LEVEL===2){a=ri(10,99);A=String(a);B=dp(ri(100,a*100-1),2);}
    else if(LEVEL===3){a=ri(1000,9999);A=dp(a,2);B=dp(ri(100,a*10-1),3);}
    else{a=ri(10,999);A=String(a);B=dp(ri(1000,a*1000-1),3);}
    return {q:[A,"−",B,"="],ans:sub(dec(A),dec(B)),asDec:true};}},
  {g:"decs",name:"Multiplying and dividing by 10, 100, 1000",make:function(){
    var x=dp(ri(1,L([9999,99999,99999,99999])),L([2,3,3,3]));
    var p=pick(L([[10,100,1000],[10,100,1000],[100,1000],[1000]]));
    var op=Math.random()<.5?"×":"÷";var X=dec(x);
    var res=op==="×"?mul(X,R(p)):div(X,R(p));
    if(LEVEL>=3&&Math.random()<.5)return {q:["□",op,fmtInt(p),"=",decStr(res)],ans:X,asDec:true};
    return {q:[x,op,fmtInt(p),"="],ans:res,asDec:true};}},
  {g:"decs",name:"Decimal times a whole number",make:function(){
    var x,k;
    if(LEVEL===1){x=dp(ri(101,999),2);k=ri(3,9);}
    else if(LEVEL===2){x=dp(ri(1001,9999),2);k=ri(3,9);}
    else if(LEVEL===3){x=dp(ri(11,999),1);k=ri(12,39);}
    else{x=dp(ri(101,999),2);k=ri(12,49);}
    return {q:[x,"×",String(k),"="],ans:mul(dec(x),R(k)),asDec:true};}},
  {g:"mult",name:"Short multiplication",make:function(){
    var r=L([[1000,9999],[10000,99999],[10000,99999],[100000,999999]]);var a=ri(r[0],r[1]),b=LEVEL>=3?ri(6,9):ri(3,9);
    return {q:[fmtInt(a),"×",String(b),"="],ans:R(a*b)};}},
  {g:"mult",name:"Long multiplication",make:function(){
    var a,b;
    if(LEVEL===1){a=Math.random()<.5?ri(120,999):ri(1000,4999);b=ri(12,89);}
    else if(LEVEL===2){a=ri(1000,4999);b=ri(12,89);}
    else if(LEVEL===3){a=ri(1000,9999);b=ri(40,99);}
    else{a=ri(5000,9999);b=ri(60,99);}
    return {q:[fmtInt(a),"×",String(b),"="],ans:R(a*b)};}},
  {g:"divi",name:"Short division",make:function(){
    var d,q,t,r;
    if(LEVEL<=2){d=ri(3,9);q=LEVEL===1?ri(100,2999):ri(1000,9999);return {q:[fmtInt(d*q),"÷",String(d),"="],ans:R(q)};}
    q=ri(100,1999);
    if(LEVEL===3){d=pick([2,4,5,6,8]);t=d===5?pick([2,4,6,8]):5;r=t*d/10;return {q:[fmtInt(d*q+r),"÷",String(d),"="],ans:R(10*q+t,10),asDec:true};}
    d=pick([4,8]);t=pick([25,50,75]);r=t*d/100;return {q:[fmtInt(d*q+r),"÷",String(d),"="],ans:R(100*q+t,100),asDec:true};}},
  {g:"divi",name:"Long division",make:function(){
    var d,q;
    if(LEVEL===1){d=ri(12,49);q=Math.random()<.6?ri(11,99):ri(101,299);}
    else if(LEVEL===2){d=ri(12,99);q=ri(101,499);}
    else if(LEVEL===3){d=ri(21,99);q=ri(101,999);}
    else{d=ri(51,99);q=ri(201,999);}

var synth=window.speechSynthesis||null;
var voice=null;
function pickVoice(){
  if(!synth)return;
  var vs=synth.getVoices()||[];
  voice=vs.find(function(v){return v.lang==="en-GB";})||vs.find(function(v){return /^en/.test(v.lang);})||null;
}
if(synth){pickVoice();try{synth.onvoiceschanged=pickVoice;}catch(e){}}
function say(parts){
  if(!synth)return false;
  try{synth.cancel();}catch(e){}
  parts.forEach(function(t){
    var u=new SpeechSynthesisUtterance(t);
    if(voice)u.voice=voice;u.lang=voice?voice.lang:"en-GB";u.rate=.85;
    synth.speak(u);
  });
  return true;
}

function arithShow(){
  var a=document.getElementById("ans");if(!a)return;
  if(!S.input){a.textContent="Type your answer";a.className="answer ph";}
  else{a.textContent=S.input;a.className="answer"+(S.checked?(S.lastOk?" ok":" no"):"");}
}
function arithKey(k){
  if(S.view!=="arith")return;
  if(S.checked){if(k==="enter")arithNext();return;}
  if(k==="back"){S.input=S.input.slice(0,-1);}
  else if(k==="enter"){arithCheck();return;}
  else if(k==="-"){if(!S.input)S.input="-";}
  else if(S.input.length<14){S.input+=k;}
  arithShow();
}
function arithCheck(){
  if(!S.input.trim())return;
  var it=S.items[S.i];var v=parseAns(S.input);
  var ok=!!v&&eq(v,it.ans);
  S.checked=true;S.lastOk=ok;
  if(ok)S.right++;else S.missed.push(it.type);
  arithShow();
  var fb=document.getElementById("fb");
  if(ok){fb.textContent=pick(["Correct.","Yes, that's it.","Spot on.","Right."]);fb.className="feedback ok";}
  else{fb.textContent=(v?"Not quite. ":"That isn't a number I can read. ")+"The answer is "+correctText(it).replace(/^-/,"−")+(it.unit&&it.text?" ("+it.unit.split(" (")[0]+")":"")+".";fb.className="feedback no";}
  var go=document.getElementById("go");go.textContent=S.i+1<S.items.length?"Next":"See results";
}

  S={view:"spell-setup"};
  var prog=load(KEY_WORDS,{});
  var words=allWords();
  var learnt=words.filter(function(w){return prog[w[0]]&&prog[w[0]].box>=3;}).length;
  var extra=load(KEY_EXTRA,[]);
  app.innerHTML='<button class="back" data-act="home">‹ Back</button>'+
    '<div class="panel"><h2>Spelling</h2>'+
    '<p class="muted" style="margin-top:6px">You\'ll hear each word, then a sentence, then the word again. Words you get wrong come back sooner.</p>'+
    '<p style="margin:14px 0"><strong>'+learnt+'</strong> of '+words.length+' words secure</p>'+
    (synth?'':'<p class="feedback no">This device can\'t read words aloud. Ask someone to read them to you, or try another browser.</p>')+
    '<button class="btn" data-act="spell-go">Start 10 words</button></div>'+
    '<div class="panel" style="margin-top:14px"><h3>Extra words</h3>'+
    '<p class="muted small" style="margin:6px 0 10px">Words Dad or your teacher want you to practise, separated by commas.</p>'+
    '<textarea id="extra" autocapitalize="off" autocorrect="off" spellcheck="false">'+esc(extra.join(", "))+'</textarea>'+
    '<div class="row" style="margin-top:10px"><button class="btn alt" data-act="extra-save">Save words</button><span class="muted small" id="exmsg"></span></div></div>';
}
function spellPick(){
  var prog=load(KEY_WORDS,{}),now=Date.now();
  var words=allWords();
  var due=[],fresh=[],later=[];
  words.forEach(function(w){var p=prog[w[0]];if(!p)fresh.push(w);else if(p.due<=now)due.push(w);else later.push(w);});
  due.sort(function(a,b){return prog[a[0]].box-prog[b[0]].box;});
  shuffle(fresh);
  later.sort(function(a,b){return prog[a[0]].due-prog[b[0]].due;});
  var dueTake=due.slice(0,7);
  return shuffle(dueTake.concat(fresh.slice(0,10-dueTake.length)).concat(later).slice(0,10));
}
function spellStart(){
  S={view:"spell",items:spellPick(),i:0,right:0,missed:[],checked:false};
  spellDraw();
}
function spellDraw(){
  var w=S.items[S.i];
  app.innerHTML='<div class="qtop"><button class="back" data-act="home">‹ Stop</button><span class="muted">'+(S.i+1)+' of '+S.items.length+'</span></div>'+
    '<div class="progress"><div style="width:'+(100*S.i/S.items.length)+'%"></div></div>'+
    '<div class="qcard"><div class="speak"><button class="btn" data-act="hear">Hear the word</button><button class="btn alt" data-act="hear-word">Word only</button></div>'+
    '<input class="spellin" id="sp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Type the word">'+
    '<div class="feedback" id="fb" aria-live="polite"></div><div class="cmp" id="cmp"></div>'+
    '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn sun" data-act="spell-check" id="go">Check</button></div></div>';
  setTimeout(function(){var i=document.getElementById("sp");if(i)i.focus();},50);
}
function markDiff(typed,target){
  var out="";for(var i=0;i<target.length;i++){var c=target[i];out+=(typed[i]===c)?esc(c):"<mark>"+esc(c)+"</mark>";}return out;
}
function spellCheck(){
  var inp=document.getElementById("sp");
  var w=S.items[S.i];
  if(S.checked){spellNext();return;}
  var typed=inp.value.trim().toLowerCase();
  if(!typed)return;
  var ok=typed===w[0].toLowerCase();
  S.checked=true;
  var prog=load(KEY_WORDS,{});var p=prog[w[0]]||{box:0,due:0,seen:0,wrong:0};
  p.seen++;
  if(ok){p.box=Math.min(5,p.box+1);S.right++;}else{p.box=0;p.wrong++;S.missed.push(w[0]);}
  p.due=Date.now()+GAPS[p.box]*86400000;
  prog[w[0]]=p;store(KEY_WORDS,prog);
  inp.className="spellin "+(ok?"ok":"no");inp.readOnly=true;
  var fb=document.getElementById("fb");
  if(ok){fb.textContent=pick(["Correct.","Spot on.","Yes, that's right."]);fb.className="feedback ok";}
  else{fb.textContent="Not quite. Here's the correct spelling:";fb.className="feedback no";
    document.getElementById("cmp").innerHTML=markDiff(typed,w[0]);}
  document.getElementById("go").textContent=S.i+1<S.items.length?"Next word":"See results";
}
function spellNext(){
  S.i++;S.checked=false;
  if(S.i>=S.items.length)spellDone();else spellDraw();
}
function spellDone(){
  var when=nowStr(),n=S.items.length;
  logSession({kind:"Spelling",when:when,score:S.right,total:n,missed:S.missed});
  S.view="spell-done";
  app.innerHTML='<div class="summary"><p class="muted">Spelling, '+esc(when)+'</p>'+
    '<p class="big" style="margin-top:8px">'+S.right+'<span> / '+n+'</span></p>'+
    '<dl><dt>To learn</dt><dd>'+(S.missed.length?S.missed.map(esc).join(", "):"Nothing missed")+'</dd></dl>'+
    '<p class="muted small">Take a screenshot and send it to Dad. These words will come back in your next sessions.</p></div>'+
    '<div class="row" style="margin-top:16px"><button class="btn" data-act="spell-go">Another 10</button><button class="btn alt" data-act="home">Done</button></div>';
}

  return {v:[lo,lo+2,lo+4,lo+6,lo+8].slice(0,n),m:lo+4};
}

    "Hedgehogs are small, spiny mammals found in gardens, parks and woodland across the UK.",
    "A hedgehog’s back is covered in thousands of sharp spines. When it is frightened, it rolls into a tight ball so that only the spines can be seen.",
    "Hedgehogs eat beetles, worms, caterpillars and slugs, which is why gardeners are often pleased to see them.",
    "They are nocturnal, which means they sleep during the day and search for food at night. In winter, they hibernate.",
    "Sadly, hedgehog numbers in the UK have fallen in recent years. Leaving small gaps in garden fences helps them move around safely."]}
};
function MC(q,o,why,ctx){return {k:"mc",q:q,o:o,why:why||"",ctx:ctx};}
function ORD(id){return {k:"order",id:id};}
var COURSE=[
/* 1 */{t:"Paragraphs have jobs",
 learn:"Good writing is built from paragraphs, and each one has a job. The opening tells the reader what the piece is about. The middle paragraphs build it up. The ending wraps it up. Start a new paragraph when the time, place, topic or person changes.",
 tasks:[MC("When should you start a new paragraph?",["When the time, place, topic or person changes","After every three sentences","When you reach the end of a line","Only at the end of a story"],"A new paragraph tells the reader that something has changed."),
  MC("What is the main job of an opening paragraph?",["To tell the reader what the piece is about and make them want to read on","To include every detail at once","To say goodbye to the reader","To list every character’s name"],"The opening sets things up so the reader knows what is coming."),
  ORD("coast")],
 write:{p:"Write a recount of a day out, real or made up, in four short paragraphs. Two or three sentences in each paragraph is plenty.",plan:["Opening: who, where and when","Paragraph 2: what happened first","Paragraph 3: what happened next, or what went wrong","Ending: how the day finished and how you felt"],check:["I wrote four paragraphs","My opening says who, where and when","Each paragraph is about one part of the day","My ending looks back on the whole day"],mins:7}},
/* 2 */{t:"Linking paragraphs through time",
 learn:"In a recount or a story, the first words of a paragraph often tell the reader how time has moved on: “After lunch,” “Later that night,” “By the evening,”. These are time adverbials. They glue paragraphs together, and they are followed by a comma.",
 tasks:[MC("Paragraph 1 ends: “…we put up our tents as the sun went down.” Which is the best start for paragraph 2?",["Later that night,","Firstly,","In conclusion,","On the other hand,"],"“Later that night” moves the reader on in time from the sunset."),
  MC("Which of these is NOT a time adverbial?",["Under the table","After breakfast","Three days later","Meanwhile"],"“Under the table” tells you where, not when."),
  ORD("diary")],
 write:{p:"Write four short paragraphs about a school day. Start each paragraph with a different time adverbial followed by a comma.",plan:["Paragraph 1 starts with… (for example: This morning,)","Paragraph 2 starts with…","Paragraph 3 starts with…","Paragraph 4 starts with…"],check:["Four paragraphs","Four different time adverbials","A comma after each adverbial","The events are in the right order"],mins:7}},
/* 3 */{t:"Instructions",
 learn:"Instructions have a title that says the goal, a list of what you need, and steps in order. Each step starts with a command verb such as “fill”, “cut” or “stir”. Words like first, next, then and finally keep the steps in order.",
 tasks:[ORD("sunflower"),
  MC("Which sentence is written as an instruction?",["Fill the pot with compost.","I filled the pot with compost.","The pot was filled with compost.","Pots are useful for plants."],"It starts with a command verb, “Fill”, telling the reader what to do."),
  MC("Where does the list of things you need belong?",["Before the steps","After the last step","In the middle of the steps","Instructions don’t need one"],"The reader needs to gather everything before starting.")],
 write:{p:"Write instructions for making a sandwich, or another simple snack.",plan:["Title: How to…","You will need:","Steps 1 to 5, each starting with a command verb","A final tip"],check:["My title says the goal","I listed what you need first","Every step starts with a command verb","I used order words like first, next and finally"],mins:6}},
/* 4 */{t:"News reports",
 learn:"A news report has a headline, then an opening paragraph that answers who, what, where and when. Next come paragraphs of detail, often with a quotation from a witness. The ending says what will happen next. Reports are written in the past tense.",
 tasks:[ORD("library"),
  MC("Which question would the opening paragraph of a news report NOT usually answer?",["What is the reporter’s favourite food?","Who was involved?","What happened?","Where did it happen?"],"The opening gives the key facts of the story, not facts about the reporter."),
  MC("Why do news reports include a quotation?",["To give a witness’s own words and make the report believable","To make the report longer","Because reports must rhyme","To tell the reader what to do"],"A real person’s words make the story feel true and add detail.")],
 write:{p:"Write a short news report with the headline “Giant pumpkin found in school garden”.",plan:["Headline","Opening: who, what, where and when","Detail: what happened and how it was found","Quotation from a witness","Ending: what will happen next"],check:["My opening answers who, what, where and when","I included a quotation with inverted commas","I wrote in the past tense","My ending looks ahead"],mins:7}},
/* 5 */{t:"Persuasive letters",
 learn:"A persuasive letter says what you want in the opening paragraph. Each reason gets its own paragraph, introduced with words like “Firstly” and “Furthermore”. Strong letters answer an objection, then finish with a clear, polite request.",
 tasks:[ORD("letter"),
  MC("Which phrase would best introduce a second reason?",["Furthermore,","Once upon a time,","Yesterday,","In the beginning,"],"“Furthermore” adds another point to your argument."),
  MC("Why does the letter mention that some people may worry a garden would be too much work?",["It shows the writer has thought about the other side, which makes the argument stronger","It is a mistake and should be removed","To make the reader worried","To fill up space"],"Answering an objection before the reader raises it makes you more convincing.")],
 write:{p:"Write a letter to your headteacher asking for something you think would improve your school.",plan:["Opening: what you are asking for","Reason 1","Reason 2","An objection someone might raise, and your answer","Ending: a polite request, then a sign-off"],check:["My request is clear in the opening","Each reason has its own paragraph","I used linking words like Firstly, Furthermore and However","I ended politely"],mins:8}},
/* 6 */{t:"Story structure",
 learn:"Most stories have five parts: an opening that introduces the character and setting, a build-up where things start to happen, a problem or turning point, a resolution where it is sorted out, and an ending. Each part usually gets its own paragraph.",
 tasks:[ORD("door"),
  MC("What usually happens in the build-up of a story?",["Events start to lead towards the problem","The story finishes","The characters say goodbye","The author lists the characters"],"The build-up creates interest and leads towards the problem."),
  MC("A strong ending often…",["links back to the opening or shows how the character has changed","introduces a brand new character","starts a new problem with no answer","repeats the title"],"Linking back makes the story feel complete.")],
 write:{p:"Plan a five-part story called “The Message in a Bottle”. Then write only the opening and the build-up.",plan:["Opening: character and setting","Build-up","Problem","Resolution","Ending"],check:["All five parts are planned","My opening introduces the character and the setting","My build-up leads towards the problem","I started a new paragraph for the build-up"],mins:7}},
/* 7 */{t:"Reports grouped by topic",
 learn:"A non-chronological report gives facts about one subject. It has an introduction, then paragraphs grouped by topic (often with subheadings), and a conclusion. Because the middle paragraphs aren’t about time, they could go in a different order.",
 tasks:[MC("Which paragraph is the introduction?",["A","B","C","D"],"Paragraph A says what hedgehogs are and where they live, which sets up the whole report.","hedgehogs"),
  MC("Which subheading fits paragraph C best?",["Diet","Appearance","Behaviour","Habitat"],"Paragraph C is all about what hedgehogs eat.","hedgehogs"),
  MC("Why could paragraphs B, C and D swap places, but paragraph A could not?",["The middle paragraphs are grouped by topic, not time, but the introduction has to come first","Because B, C and D are shorter","Because A has the most full stops","They couldn’t swap at all"],"Topic paragraphs don’t depend on each other’s order. The introduction sets up the whole report.","hedgehogs")],
 write:{p:"Write a short report about an animal or a hobby you know well. Write the introduction and one topic paragraph with a subheading. Plan the rest.",plan:["Introduction: what it is, in one or two sentences","Subheading 1 and its facts","Subheading 2 (plan only)","Subheading 3 (plan only)","Conclusion (plan only)"],check:["My introduction says what the report is about","I used a subheading","My paragraph sticks to one topic","I wrote facts in the present tense"],mins:6}},
/* 8 */{t:"Linking ideas between paragraphs",
 learn:"Paragraphs feel connected when the first sentence of a new paragraph links back to the one before. You can use an adverbial such as “As a result,” “In contrast,” or “Meanwhile,”, or refer back with words like “This problem” or “Despite this”.",
 tasks:[MC("Paragraph 1: “The village had no shop and only one bus a day.” Paragraph 2 starts: “___ most families moved to the town.”",["As a result,","In contrast,","For example,","Meanwhile,"],"Families moving away was caused by the lack of shops and buses."),
  MC("Paragraph 1: “Lions hunt mostly at night.” Paragraph 2 starts: “___ cheetahs hunt during the day.”",["In contrast,","As a result,","Therefore,","For example,"],"The two facts are opposites, so you need a contrast."),
  MC("Paragraph 1: “Sam searched the attic for hours.” Paragraph 2 starts: “___ his sister was quietly reading the map downstairs.”",["Meanwhile,","Therefore,","Firstly,","As a result,"],"“Meanwhile” shows two things happening at the same time."),
  MC("Paragraph 1: “The river flooded the main road.” Paragraph 2 starts: “___ meant the bus had to take the long way round.”",["This flooding","Those flooding","Their flooding","These flooding"],"“This flooding” points back to what happened in the last paragraph.")],
 write:{p:"Write three short paragraphs about your favourite season. Start paragraphs 2 and 3 with a linking adverbial that connects back to the paragraph before.",plan:["Paragraph 1: what the season is like","Paragraph 2 starts with…","Paragraph 3 starts with…"],check:["Three paragraphs","Paragraphs 2 and 3 start with a linking adverbial","Each link makes sense with the paragraph before","A comma after each adverbial"],mins:6}},
/* 9 */{t:"Balanced arguments",
 learn:"A balanced argument looks at both sides of a question. The introduction explains the question, one paragraph gives the arguments for, one gives the arguments against, and the conclusion is where the writer finally gives their own view.",
 tasks:[ORD("phones"),
  MC("Where should the writer give their own opinion in a balanced argument?",["In the conclusion","In the introduction","In every paragraph","Nowhere at all"],"The rest of the piece is fair to both sides. The conclusion is for your view."),
  MC("Which pair of phrases introduces the two sides?",["On the one hand… On the other hand…","Once upon a time… The end","Dear Sir… Yours faithfully","Mix… Stir…"],"These phrases signal two opposite points of view.")],
 write:{p:"Write a balanced argument: “Should homework be banned?”",plan:["Introduction: the question","Arguments for","Arguments against","Conclusion: your view and why"],check:["Four paragraphs","Both sides are explained fairly","I used “On the one hand” and “On the other hand”","My opinion is only in the conclusion"],mins:8}},
/* 10 */{t:"Explanations",
 learn:"An explanation tells the reader how or why something happens. It opens with what is being explained, then goes step by step through causes and effects, using words like “because”, “so” and “as a result”. It is usually written in the present tense.",
 tasks:[ORD("rainbow"),
  MC("Which words show cause and effect?",["because, so, as a result","once upon a time","dear, yours sincerely","mix, stir, pour"],"These words show why one thing leads to another."),
  MC("Explanations are usually written in…",["the present tense","the future tense","the form of a poem","speech marks"],"They describe how things happen in general, so the present tense fits.")],
 write:{p:"Write an explanation: “Why do we have day and night?” Useful facts: the Earth spins once every 24 hours; the side facing the Sun has day; the side facing away has night.",plan:["Opening: what you will explain","Step 1: the Earth spins","Step 2: the side facing the Sun","Step 3: the side facing away","Ending: so every place has day and night in each 24 hours"],check:["My opening says what I am explaining","My steps are in a logical order","I used because, so or as a result","Present tense throughout"],mins:7}},
/* 11 */{t:"Openings that hook + fronted adverbials",
 learn:"You can hook a reader with action, dialogue, a question or a vivid description. Avoid openings like “This story is about…”. Sentence skill: a fronted adverbial comes at the start of a sentence and is followed by a comma: “Without a sound, the fox crept away.”",
 tasks:[MC("Which opening uses action to hook the reader?",["Maya sprinted through the gate as the bell began to ring.","This story is about a girl called Maya.","It was a nice day.","Maya was a girl."],"Something is happening straight away, so the reader wants to know why."),
  MC("Which is the weakest opening?",["This story is about a dragon.","Smoke curled out of the cave mouth.","“Don’t go in there,” whispered Leo.","Have you ever seen a dragon sneeze?"],"It tells the reader what the story is about instead of pulling them in."),
  MC("Which sentence punctuates the fronted adverbial correctly?",["Without a sound, the fox crept away.","Without a sound the fox, crept away.","Without, a sound the fox crept away.","Without a sound the fox crept, away."],"The comma goes straight after the fronted adverbial.")],
 write:{p:"Write three different openings for a story called “The Storm”: one with action, one with dialogue, one with description. Then put a star next to your best one.",plan:["Action opening idea","Dialogue opening idea","Description opening idea"],check:["Three different openings","None of them starts “This story is about”","At least one has a fronted adverbial with a comma","I starred my best one"],mins:6}},
/* 12 */{t:"Endings that link back + subordinate clauses",
 learn:"A satisfying ending often echoes the opening or shows how a character has changed. Sentence skill: a subordinating conjunction (because, although, when, if, while, until, since) adds a clause that can’t stand on its own: “Although it was cold, we went swimming.”",
 tasks:[MC("A story opens with a lost dog called Biscuit. Which ending links back best?",["That night, Biscuit curled up on his old blanket as if he had never been away.","The end.","Then everyone went home.","Suddenly, a dragon appeared."],"It returns to Biscuit and closes the problem from the opening."),
  MC("Which word best joins “We stayed inside” and “it was raining”?",["because","although","unless","until"],"Staying inside happened as a result of the rain."),
  MC("Which sentence contains a subordinate clause?",["Although it was cold, we went swimming.","It was cold and we went swimming.","We went swimming.","It was cold. We went swimming."],"“Although it was cold” can’t stand on its own as a sentence.")],
 write:{p:"Write an ending for your Message in a Bottle story from Day 6 that links back to the opening. Include one sentence starting with “Although” or “When”.",plan:["How did your opening begin?","What has changed for the character?","Final sentence idea"],check:["My ending links back to the opening","It shows how the character has changed or what they feel","I used a sentence starting with Although or When","A comma after the subordinate clause"],mins:6}},
/* 13 */{t:"Avoiding repetition + relative clauses",
 learn:"Repeating the same noun again and again makes writing clunky. Use pronouns (he, it, they) and other names for the same thing (the dragon, the beast, the creature). Sentence skill: relative clauses start with who, which, where, whose or that, and add information about a noun.",
 tasks:[MC("Which version avoids repetition best?",["The dragon flew over the hill. It landed on the rocks, and the enormous beast let out a roar.","The dragon flew over the hill. The dragon landed. The dragon roared.","Dragon flew. Dragon landed. Dragon roared.","The dragon flew over the hill and the dragon landed and the dragon roared."],"It uses “it” and “the enormous beast” instead of repeating “the dragon”."),
  MC("“The girl ___ won the race is my cousin.”",["who","which","where","whose"],"Use “who” for people."),
  MC("“The museum, ___ opened in 1902, is free to visit.”",["which","who","where","whose"],"Use “which” for things.")],
 write:{p:"Write one paragraph describing an interesting character. Use at least two relative clauses, and refer to the character in three different ways (their name, a pronoun and a description).",plan:["Name","Pronoun","Another way to refer to them (for example: the old sailor)","Relative clause 1","Relative clause 2"],check:["Two relative clauses","The character is referred to in three ways","No noun repeated in back-to-back sentences","Commas around any extra-information clauses"],mins:6}},
/* 14 */{t:"Topic sentences + expanded noun phrases",
 learn:"In non-fiction, the first sentence of a paragraph usually tells the reader what the paragraph is about. That is the topic sentence. Sentence skill: an expanded noun phrase adds detail to a noun, for example “the tall, crooked tower on the hill”.",
 tasks:[MC("Choose the best topic sentence for this paragraph: “___ They dive deep under the water and catch fish, squid and krill with their sharp beaks.”",["Penguins are skilled hunters in the water.","Penguins cannot fly.","Some zoos keep penguins.","Penguins have black and white feathers."],"The rest of the paragraph is all about hunting."),
  MC("Which is an expanded noun phrase?",["the tall, crooked tower on the hill","the tower","it towered","towering over"],"It adds adjectives and a phrase to the noun “tower”."),
  MC("What does a topic sentence do?",["Tells the reader what the paragraph is about","Ends the paragraph","Gives a quotation","Asks the reader to reply"],"Everything else in the paragraph should fit under it.")],
 write:{p:"Write two paragraphs of a report about a place you know (a park, a town, a beach). Start each with a topic sentence and include two expanded noun phrases.",plan:["Paragraph 1 topic sentence","Paragraph 2 topic sentence","Expanded noun phrase 1","Expanded noun phrase 2"],check:["Each paragraph starts with a topic sentence","The rest of each paragraph matches its topic sentence","Two expanded noun phrases","Present tense"],mins:6}},
/* 15 */{t:"Review: a whole story",
 learn:"Today you bring it together: plan five parts, give each one its own paragraph, link the paragraphs with adverbials, hook the reader at the start and link back at the end.",
 tasks:[MC("Which change needs a new paragraph?",["The story moves on to the next morning","A sentence gets long","You use a comma","You use an adjective"],"A change of time means a new paragraph."),
  MC("Which is the best start for the paragraph after a problem has been solved?",["At last,","Once upon a time,","Firstly,","Dear Sir,"],"“At last” signals relief and the resolution."),
  MC("Which opening hooks the reader best?",["The lights flickered once, twice, then died.","This is a story about a power cut.","It was a day.","My story is good."],"Something happens straight away, and the reader wants to know what comes next.")],
 write:{p:"Plan and write a short story called “The Day the Lights Went Out”. Keep each paragraph to two or three sentences.",plan:["Opening","Build-up","Problem","Resolution","Ending that links back"],check:["Five paragraphs","A hooking opening","Linking adverbials between paragraphs","An ending that links back to the opening"],mins:10}},
/* 16 */{t:"Parenthesis + short paragraphs",
 learn:"Parenthesis adds extra information to a sentence using brackets, commas or dashes. If you take it out, the sentence still makes sense: “Mount Everest (the highest mountain in the world) is in the Himalayas.” Structure tip: a very short paragraph can create suspense or highlight a moment.",
 tasks:[MC("Which sentence uses brackets correctly?",["Mount Everest (the highest mountain in the world) is in the Himalayas.","Mount Everest (the highest mountain) in the world is in the Himalayas.","Mount Everest the highest mountain in the world (is in the Himalayas).","Mount Everest the highest (mountain in the world is) in the Himalayas."],"Take the brackets out and the sentence still makes sense."),
  MC("Which sentence uses commas for parenthesis correctly?",["My uncle, who lives in Wales, keeps bees.","My uncle who lives, in Wales keeps bees.","My, uncle who lives in Wales keeps bees.","My uncle who lives in Wales, keeps, bees."],"The commas go round the extra information, in a pair."),
  MC("Why might a writer use a one-sentence paragraph?",["To create suspense or highlight a moment","Because they forgot to finish","To start a list","It is always a mistake"],"Its shortness makes the reader pause.")],
 write:{p:"Write a paragraph about a famous place or person. Include two pieces of parenthesis: one in brackets and one between commas or dashes.",plan:["Subject","Extra information 1 (brackets)","Extra information 2 (commas or dashes)"],check:["Two pieces of parenthesis","Each sentence still makes sense without them","Brackets, commas or dashes used in pairs"],mins:5}},
/* 17 */{t:"Sentence length for effect",
 learn:"Long sentences can build up detail and tension. A short sentence after them hits hard: “The floorboards creaked as I crept along the dark landing, holding my breath and feeling for the wall. Then the door slammed.”",
 tasks:[MC("Which pair builds tension best?",["I crept along the landing, feeling for the wall in the dark. Something moved.","I walked. I walked. I walked.","I went upstairs and it was dark and I was scared and then something moved.","The landing was long. The landing was dark."],"A long, careful sentence followed by a short shock."),
  MC("Why might a writer use a one-word sentence such as “Silence.”?",["For dramatic effect","Because they ran out of words","To list items","To ask a question"],"It makes the reader stop on that moment."),
  MC("Where is a short, punchy sentence most effective in a story?",["At a moment of surprise or tension","In the title","In every sentence","Only in the first line"],"Used everywhere, short sentences lose their power.")],
 write:{p:"Write one paragraph: a character hears a noise in the night. Mix long and short sentences, and end with a very short one.",plan:["Long sentence building the scene","The noise","Short sentence for the ending"],check:["At least two long sentences","At least two short sentences","The paragraph ends with a short sentence","Commas in the long sentences where needed"],mins:5}},
/* 18 */{t:"Formal writing + the passive voice",
 learn:"Formal letters and reports avoid chatty words and contractions (write “do not”, not “don’t”). The passive voice is useful when the action matters more than who did it: “The window was broken.” instead of “Someone broke the window.”",
 tasks:[MC("Which sentence is in the passive voice?",["The window was broken by the ball.","The ball broke the window.","I broke the window.","The window is big."],"The window (the thing the action happens to) comes first, with “was broken”."),
  MC("Which sentence is the most formal?",["I would be grateful if you could reply.","Get back to me asap.","Write back, yeah?","Reply soon!!"],"Polite, full words and no slang."),
  MC("Which sign-off suits a formal letter to someone whose name you know?",["Yours sincerely,","See ya,","Love from,","Bye!"],"“Yours sincerely” is used when you have written “Dear” and the person’s name.")],
 write:{p:"Write a formal letter to your local council about litter in a park, in three paragraphs: the problem, a suggestion, and a polite request. Include at least one passive sentence.",plan:["The problem","Your suggestion","Polite request and sign-off","Passive sentence idea"],check:["Three paragraphs","No contractions or chatty words","At least one passive sentence","A formal sign-off"],mins:7}},
/* 19 */{t:"Colons and semi-colons",
 learn:"A semi-colon joins two closely linked clauses that could each be a sentence: “It was late; we hurried home.” A colon introduces a list or an explanation: “I knew what to bring: a torch, a map and a coat.” Structure tip: the conclusion of a balanced argument often starts with “Overall,” or “In conclusion,”.",
 tasks:[MC("Which uses a semi-colon correctly?",["It was late; we hurried home.","It was; late we hurried home.","It; was late we hurried home.","It was late we; hurried home."],"Both sides of the semi-colon could be sentences on their own."),
  MC("Which uses a colon correctly?",["I knew what to bring: a torch, a map and a coat.","I knew: what to bring a torch, a map and a coat.","I: knew what to bring a torch, a map and a coat.","I knew what to bring a torch: a map and a coat."],"The colon comes before the list."),
  MC("Which phrase best starts the conclusion of a balanced argument?",["Overall,","Once upon a time,","Firstly,","Dear Sir,"],"“Overall” signals that you are weighing everything up.")],
 write:{p:"Write a balanced argument in four short paragraphs: “Should school start an hour later?” Include one semi-colon and one colon.",plan:["Introduction","For","Against","Conclusion (Overall, …)"],check:["Four paragraphs","One semi-colon joining two linked clauses","One colon before a list or explanation","The conclusion gives my view"],mins:8}},
/* 20 */{t:"Review: a news report with sentence skills",
 learn:"Put whole-piece structure and the sentence skills together: a clear opening, linked paragraphs, a quotation, and a mix of fronted adverbials, relative clauses and parenthesis.",
 tasks:[MC("Which opening paragraph suits a news report?",["Yesterday afternoon, a pet tortoise escaped from a house in Elm Street and was found two miles away.","Once upon a time there was a tortoise.","Tortoises are reptiles with shells.","Have you ever owned a tortoise? You should!"],"It answers who, what, where and when."),
  MC("Which sentence has a relative clause?",["The tortoise, which is 40 years old, is now safe at home.","The tortoise is safe.","The tortoise is old and safe.","Safe at home, the tortoise slept."],"“which is 40 years old” adds information about the tortoise."),
  MC("Which sentence starts with a fronted adverbial?",["Early this morning, the tortoise was spotted by a jogger.","The tortoise was spotted by a jogger.","A jogger spotted the tortoise.","The jogger, who was running, spotted it."],"“Early this morning,” comes first and is followed by a comma.")],
 write:{p:"Write a news report: “Escaped tortoise found two miles from home”. Include a quotation, a relative clause and a fronted adverbial.",plan:["Headline","Opening: who, what, where, when","Detail","Quotation","What happens next"],check:["My opening answers who, what, where and when","The quotation is punctuated correctly","At least one relative clause","At least one fronted adverbial with a comma"],mins:8}},
/* 21 */{t:"Main and subordinate clauses",
 learn:"A main clause makes sense on its own. A subordinate clause adds information but can’t stand alone. It can go at the start, in the middle or at the end: “When the bell rang, the children ran outside.” If it comes first, put a comma after it.",
 tasks:[MC("In “When the bell rang, the children ran outside.”, which is the main clause?",["the children ran outside","When the bell rang","When","the bell rang outside"],"“The children ran outside” makes sense on its own."),
  MC("Which sentence has the subordinate clause at the end?",["We played football until it got dark.","Until it got dark, we played football.","We played football.","It got dark."],"“until it got dark” comes after the main clause."),
  MC("Which sentence is punctuated correctly?",["If it rains tomorrow, we will stay inside.","If it rains tomorrow we, will stay inside.","If, it rains tomorrow we will stay inside.","If it rains tomorrow we will, stay inside."],"The comma comes straight after the subordinate clause.")],
 write:{p:"Write two short paragraphs about a sports day. Include four sentences with subordinate clauses, with at least one at the start and one at the end.",plan:["Paragraph 1: the morning","Paragraph 2: the races","Subordinate clause at the start","Subordinate clause at the end"],check:["Two paragraphs","Four subordinate clauses","A comma after each clause that comes first","Every sentence has a main clause"],mins:6}},
/* 22 */{t:"Relative clauses in the middle",
 learn:"A relative clause can sit in the middle of a sentence, between commas: “The boy, who had forgotten his coat, shivered at the bus stop.” Use who for people, which for things, where for places and whose for belonging.",
 tasks:[MC("Which sentence has a relative clause in the middle?",["The boy, who had forgotten his coat, shivered at the bus stop.","The boy shivered at the bus stop.","The boy shivered because he had forgotten his coat.","Shivering, the boy waited."],"“who had forgotten his coat” sits between commas in the middle."),
  MC("“That is the café ___ we met.”",["where","who","whose","which"],"Use “where” for places."),
  MC("“My friend, ___ dog is called Max, lives next door.”",["whose","who","where","which"],"Use “whose” for something that belongs to someone.")],
 write:{p:"Describe your school in one paragraph using three relative clauses, with at least one in the middle of a sentence between commas.",plan:["A person to describe","A place to describe","A thing to describe"],check:["Three relative clauses","At least one in the middle, between commas","The right word each time (who, which, where, whose)"],mins:5}},
/* 23 */{t:"Varying sentence openers",
 learn:"Writing feels flat when every sentence starts the same way. Mix your openers: a subordinate clause (As the sun set,), an adverb (Slowly,), an -ing word (Opening the box,), or a prepositional phrase (Under the bridge,).",
 tasks:[MC("Which sentence starts with a subordinate clause?",["As the sun set, the birds fell silent.","The birds fell silent.","Slowly, the birds fell silent.","Birds fell silent at sunset."],"“As the sun set” has a verb but can’t stand alone."),
  MC("Which is the best way to combine “He opened the box. He gasped.”?",["Opening the box, he gasped.","He opened the box he gasped.","He opened, the box gasped.","Opened box, gasped."],"An -ing opener joins the two actions smoothly."),
  MC("Which opener is a prepositional phrase?",["Under the bridge,","Quickly,","Although it was late,","Shouting loudly,"],"“Under” is a preposition telling you where.")],
 write:{p:"Write a paragraph about a chase. No two sentences may start the same way. Use at least three different kinds of opener.",plan:["Opener 1 (subordinate clause)","Opener 2 (adverb)","Opener 3 (-ing word)","Opener 4 (prepositional phrase)"],check:["No two sentences start the same way","Three different kinds of opener","A comma after each opener"],mins:5}},
/* 24 */{t:"However, therefore and other linking adverbs",
 learn:"Words like however, therefore and in addition link ideas, but they can’t join two clauses the way a conjunction does. Start a new sentence and add a comma: “It was sunny. However, it was very cold.”",
 tasks:[MC("Which sentence punctuates “however” correctly?",["It was sunny. However, it was very cold.","It was sunny however it was very cold.","It was sunny, however it was very cold.","However it was sunny it was very cold."],"“However” starts a new sentence and is followed by a comma."),
  MC("Which word is a co-ordinating conjunction that joins two equal clauses?",["but","however","therefore","meanwhile"],"“but” can join two clauses in one sentence."),
  MC("Choose the best link: “Cats sleep for much of the day. ___, dogs often need long walks.”",["On the other hand","As a result","Therefore","For example"],"The two facts contrast with each other.")],
 write:{p:"Write two paragraphs comparing two pets. Use However, In addition and On the other hand, punctuated correctly.",plan:["Paragraph 1: pet A","Paragraph 2: pet B","Where “However” goes","Where “In addition” goes"],check:["Two paragraphs","However, In addition and On the other hand all used","Each followed by a comma","Each starts a new sentence"],mins:6}},
/* 25 */{t:"Laying out dialogue",
 learn:"Speech goes inside inverted commas, with its punctuation inside too: “Where are you going?” asked Dad. Start a new line every time a different person speaks. That is a structure rule as well as a punctuation one.",
 tasks:[MC("Which is punctuated correctly?",["“Where are you going?” asked Dad.","“Where are you going” asked Dad?","Where are you going? “asked Dad.”","“Where are you going”? asked Dad."],"The question mark belongs inside the inverted commas."),
  MC("When must you start a new line in dialogue?",["Each time a different person speaks","After every three lines","Only when someone shouts","Never"],"New speaker, new line."),
  MC("Which is punctuated correctly?",["“I’m hungry,” said Leo.","“I’m hungry.” said Leo.","“I’m hungry” said Leo.","I’m hungry, “said Leo.”"],"A comma, not a full stop, before “said Leo”, and it goes inside the inverted commas.")],
 write:{p:"Write a short conversation between two characters who have found something strange. At least six lines of speech, with some action between the lines.",plan:["Character 1","Character 2","What they found","How the conversation ends"],check:["A new line for each speaker","Punctuation inside the inverted commas","Some action or description between the speech","At least six lines of speech"],mins:6}},
/* 26 */{t:"Modal verbs and possibility",
 learn:"Modal verbs (will, must, should, could, might, may) show how certain or necessary something is. Adverbs such as perhaps, surely and definitely do the same. Persuasive writing uses strong ones; balanced writing uses careful ones.",
 tasks:[MC("Which word shows the strongest certainty?",["will","might","could","may"],"“will” leaves no doubt."),
  MC("Which sentence uses an adverb of possibility?",["Perhaps we should wait.","We waited.","We should wait.","Wait!"],"“Perhaps” shows how likely something is."),
  MC("Which sentence persuades most strongly?",["We must protect our parks.","We might protect our parks.","Parks could be protected.","Perhaps parks are nice."],"“must” is the strongest modal verb here.")],
 write:{p:"Write a persuasive paragraph arguing for a new playground. Use at least three modal verbs and one adverb of possibility.",plan:["Main claim","Reason 1","Reason 2","Strong final sentence"],check:["Three modal verbs","One adverb of possibility","A clear main claim","A strong final sentence"],mins:5}},

  MC("Which sentence is passive?",["The water was heated for five minutes.","We heated the water for five minutes.","Heat the water for five minutes.","The water is hot."],"The water comes first, and we are not told who heated it."),
  MC("Which sentence suits a science report best?",["The temperature was recorded every minute.","We like science lots!","It was boiling, wow!","Then I did the next bit."],"Formal, precise and passive.")],
 write:{p:"Write up a simple experiment (for example, which material keeps an ice cube frozen longest) in three short paragraphs: what was done, what was found, and a conclusion. Use the passive at least twice.",plan:["Method: what was done","Results: what was found","Conclusion"],check:["Three paragraphs","Two passive sentences","Formal language","Past tense for what was done"],mins:7}},
/* 28 */{t:"Review: holding a whole piece together",

  MC("In that story, which word in paragraph 4 signals a change of direction?",["however","afternoon","cracks","everyone"],"“however” tells the reader that things are about to go differently."),

 write:{p:"Write a complete short story called “The Key That Didn’t Fit”. Five paragraphs.",plan:["Opening that hooks","Build-up","Problem","Resolution","Ending that links back"],check:["Five paragraphs, each doing one job","A hooking opening and an ending that links back","Linking adverbials between paragraphs","Varied sentence openers and at least one relative clause"],mins:10}}

/* ---------- course engine ---------- */
var KEY_COURSE="satsp-course-v1";
function cload(){return load(KEY_COURSE,{});}
function cDay(n){return cload()[n]||{};}
function cSave(n,patch){var c=cload();var d=c[n]||{};for(var k in patch)d[k]=patch[k];c[n]=d;store(KEY_COURSE,c);}
function currentDay(){var c=cload();for(var i=1;i<=30;i++){if(!(c[i]&&c[i].done))return i;}return 31;}
function courseMaths(n){
  var long=COURSE[n-1].write.mins>=9;
  var tier=n<=10?1:(n<=20?2:3);
  return {level:n<=10?3:4,tier:tier,an:long?4:(n<=10?6:5),rn:long?2:3};
}
var timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}

function courseOpen(){var cur=currentDay();if(cur>30)courseAll();else dayScreen(cur);}
function courseAll(){
  stopTimer();S={view:"course-all"};
  var c=cload(),cur=currentDay(),cells="";
  for(var i=1;i<=30;i++){
    var done=c[i]&&c[i].done,open=i<=cur;
    cells+='<button class="daycell'+(done?" done":"")+(i===cur?" now":"")+'" data-act="day" data-n="'+i+'"'+(open?"":" disabled")+'><strong>'+(done?"✓ ":"")+'Day '+i+'</strong><span>'+esc(COURSE[i-1].t)+'</span></button>';
  }
  app.innerHTML='<button class="back" data-act="home">‹ Back</button><h2 style="margin-bottom:6px">30-day course</h2>'+
    '<p class="muted" style="margin-bottom:14px">'+(cur>30?"All 30 days done.":"You can redo any finished day. The next day opens when today is complete.")+'</p><div class="days">'+cells+'</div>';
}
function dayScreen(n){
  stopTimer();S={view:"day",day:n};
  var d=COURSE[n-1],st=cDay(n),cm=courseMaths(n);
  var mMin=Math.round((cm.an*PACE[cm.level-1]+cm.rn*90)/60);
  var allDone=st.maths&&st.tried&&st.write;
  if(allDone&&!st.done){
    cSave(n,{done:true,when:nowStr()});st=cDay(n);
    logSession({kind:"Course, day "+n,when:st.when,score:st.maths.s+st.tried.s,total:st.maths.t+st.tried.t});
  }
  function step(num,key,title,sub,act,res){
    var done=!!st[key];
    return '<div class="step'+(done?" sdone":"")+'"><div class="snum">'+(done?"✓":num)+'</div><div class="sbody"><h3>'+title+'</h3><p class="muted small">'+sub+'</p>'+(done?'<p class="small"><strong>'+res+'</strong></p>':'')+'</div>'+
      '<button class="btn'+(done?" alt":"")+'" data-act="'+act+'" data-n="'+n+'">'+(done?"Redo":"Start")+'</button></div>';
  }
  var html='<div class="qtop"><button class="back" data-act="home">‹ Home</button><button class="back" data-act="course-all">All days ›</button></div>'+
    '<p class="muted">Day '+n+' of 30</p><h2 style="margin-bottom:16px">'+esc(d.t)+'</h2><div class="steps">'+
    step(1,"maths","Maths",cm.an+" sums at Level "+cm.level+", then "+cm.rn+" word problems. About "+mMin+" minutes.","c-maths",st.maths?st.maths.s+" / "+st.maths.t+" correct":"")+
    step(2,"tried","Learn and try","Today’s idea, then a few questions. About 4 minutes.","c-try",st.tried?st.tried.s+" / "+st.tried.t+" correct":"")+
    step(3,"write","Write",d.write.mins+" minutes of writing on paper, plus 2 minutes to plan.","c-write",st.write?st.write.ticks+" of "+st.write.total+" checklist points ticked":"")+
    '</div>';
  if(st.done){
    html+='<div class="summary" style="margin-top:18px"><p class="muted">Day '+n+' complete, '+esc(st.when)+'</p>'+
      '<dl><dt>Maths</dt><dd>'+st.maths.s+' / '+st.maths.t+(st.maths.missed&&st.maths.missed.length?" (missed: "+esc(st.maths.missed.join(", "))+")":"")+'</dd>'+
      '<dt>Learn and try</dt><dd>'+st.tried.s+' / '+st.tried.t+'</dd>'+
      '<dt>Writing checklist</dt><dd>'+st.write.ticks+' of '+st.write.total+'</dd></dl>'+
      '<p class="muted small">Take a screenshot and send it to Dad, with a photo of your writing.</p></div>';
    if(n<30)html+='<div class="row" style="margin-top:14px"><button class="btn sun" data-act="day" data-n="'+(n+1)+'">Go to Day '+(n+1)+'</button></div>';
  }
  app.innerHTML=html;
}
function courseMathsStart(n){
  var cm=courseMaths(n);LEVEL=cm.level;
  var items=[],gens=shuffle(GENS.slice()),rg=shuffle(RGENS.slice());
  for(var i=0;i<cm.an;i++){var g=gens[i%gens.length];var it=g.make();it.type=g.name;items.push(it);}
  for(var j=0;j<cm.rn;j++){var r=rg[j];var it2=r.make(cm.tier);it2.type=r.name;items.push(it2);}
  S={view:"arith",items:items,i:0,input:"",right:0,missed:[],start:Date.now(),checked:false,course:n};
  arithDraw();
}
function courseMathsDone(){
  var n=S.course,secs=Math.round((Date.now()-S.start)/1000);
  var seen={},missed=S.missed.filter(function(t){if(seen[t])return false;seen[t]=1;return true;});
  cSave(n,{maths:{s:S.right,t:S.items.length,secs:secs,missed:missed}});
  dayScreen(n);
}

/* learn and try */
function tryStart(n){stopTimer();S={view:"try",day:n,i:-1,right:0,answered:false};tryDraw();}
function ctxHTML(id){
  var t=TEXTS[id];
  return '<div class="ctx"><h3>'+esc(t.title)+'</h3>'+t.p.map(function(p,i){return '<p><strong>'+"ABCDE"[i]+'</strong> '+esc(p)+'</p>';}).join("")+'</div>';
}
function tryDraw(){
  var d=COURSE[S.day-1];
  var head='<div class="qtop"><button class="back" data-act="day" data-n="'+S.day+'">‹ Day '+S.day+'</button><span class="muted">'+(S.i<0?"Learn":(S.i+1)+" of "+d.tasks.length)+'</span></div>'+
    '<div class="progress"><div style="width:'+(100*Math.max(0,S.i)/d.tasks.length)+'%"></div></div>';
  if(S.i<0){
    app.innerHTML=head+'<div class="panel"><p class="muted small">Today’s idea</p><h2 style="margin:4px 0 10px">'+esc(d.t)+'</h2><p>'+esc(d.learn)+'</p>'+
      '<div class="row" style="margin-top:18px"><button class="btn" data-act="try-next">Start the questions</button></div></div>';
    return;
  }
  var tk=d.tasks[S.i];
  var nextBtn=S.answered?'<div class="row" style="margin-top:14px"><button class="btn" data-act="try-next">'+(S.i+1<d.tasks.length?"Next":"Finish")+'</button></div>':'';
  if(tk.k==="mc"){
    if(!S.perm)S.perm=shuffle(tk.o.map(function(x,i){return i;}));
    var opts=S.perm.map(function(oi){
      var cls="opt";
      if(S.answered){if(oi===0)cls+=" right";else if(oi===S.chose)cls+=" wrong";}
      return '<button class="'+cls+'" data-act="mc" data-o="'+oi+'"'+(S.answered?" disabled":"")+'>'+esc(tk.o[oi])+'</button>';
    }).join("");
    var fb="";
    if(S.answered)fb='<p class="feedback '+(S.chose===0?"ok":"no")+'">'+(S.chose===0?"Correct. ":"Not quite. ")+'<span style="font-weight:400;color:var(--ink)">'+esc(tk.why)+'</span></p>';
    app.innerHTML=head+(tk.ctx?ctxHTML(tk.ctx):"")+'<div class="panel"><p class="qline">'+esc(tk.q)+'</p><div class="opts">'+opts+'</div>'+fb+nextBtn+'</div>';
  } else {
    var t=TEXTS[tk.id],n=t.p.length;
    if(!S.shuf){do{S.shuf=shuffle(t.p.map(function(x,i){return i;}));}while(S.shuf.every(function(v,i){return v===i;}));S.seq=[];}
    var cards=S.shuf.map(function(pi){
      var pos=S.seq.indexOf(pi),cls="ordcard"+(pos>=0?" picked":"");
      if(S.answered)cls+=(S.seq[pos]===pos?" right":" wrong");
      return '<button class="'+cls+'" data-act="ord" data-p="'+pi+'"'+(S.answered||pos>=0?" disabled":"")+'><span class="badge">'+(pos>=0?pos+1:"")+'</span><span>'+esc(t.p[pi])+'</span></button>';
    }).join("");
    var ctrl="";
    if(!S.answered)ctrl='<div class="row" style="margin-top:12px"><button class="btn alt" data-act="ord-reset">Start again</button><button class="btn" data-act="ord-check"'+(S.seq.length<n?" disabled":"")+'>Check</button></div>';
    var fb2="";
    if(S.answered){
      var ok=S.seq.every(function(v,i){return v===i;});
      fb2='<p class="feedback '+(ok?"ok":"no")+'">'+(ok?"Correct, every paragraph in the right place.":"Not quite. Here is the right order:")+'</p>';
      if(!ok)fb2+='<ol class="rightorder">'+t.p.map(function(p){return '<li>'+esc(p)+'</li>';}).join("")+'</ol>';
    }
    app.innerHTML=head+'<div class="panel"><p class="qline">Put the paragraphs of “'+esc(t.title)+'” in order. Tap the first paragraph, then the second, and so on.</p>'+
      '<div class="ords">'+cards+'</div>'+ctrl+fb2+nextBtn+'</div>';
  }
}
function tryNext(){
  var d=COURSE[S.day-1];
  S.i++;S.answered=false;S.perm=null;S.shuf=null;S.seq=[];S.chose=null;
  if(S.i>=d.tasks.length){cSave(S.day,{tried:{s:S.right,t:d.tasks.length}});dayScreen(S.day);return;}
  tryDraw();window.scrollTo(0,0);
}

/* write */
function writeStart(n){stopTimer();S={view:"write",day:n};writeDraw();}
function writeDraw(){
  var w=COURSE[S.day-1].write,plans=load("satsp-plan-"+S.day,[]),ticks=load("satsp-ticks-"+S.day,[]);
  app.innerHTML='<div class="qtop"><button class="back" data-act="day" data-n="'+S.day+'">‹ Day '+S.day+'</button><span class="muted">Write</span></div>'+
    '<div class="panel"><p class="muted small">Your task</p><p class="qline" style="margin-top:4px">'+esc(w.p)+'</p></div>'+
    '<div class="panel" style="margin-top:12px"><h3>1. Plan (2 minutes)</h3><p class="muted small" style="margin:4px 0 10px">A few words for each box is enough. You can plan on paper instead.</p>'+
    w.plan.map(function(lbl,i){return '<label class="planbox"><span>'+esc(lbl)+'</span><textarea data-plan="'+i+'" rows="2">'+esc(plans[i]||"")+'</textarea></label>';}).join("")+'</div>'+
    '<div class="panel" style="margin-top:12px"><h3>2. Write it on paper ('+w.mins+' minutes)</h3>'+
    '<div class="row" style="margin-top:10px"><button class="btn sun" data-act="timer" data-m="'+w.mins+'">Start '+w.mins+'-minute timer</button><span class="timer" id="timer" aria-live="polite"></span></div></div>'+
    '<div class="panel" style="margin-top:12px"><h3>3. Check your writing</h3><p class="muted small" style="margin:4px 0 10px">Tick only what you really did.</p>'+
    w.check.map(function(c,i){return '<label class="tick"><input type="checkbox" data-tick="'+i+'"'+(ticks[i]?" checked":"")+'><span>'+esc(c)+'</span></label>';}).join("")+
    '<div class="row" style="margin-top:14px"><button class="btn" data-act="write-done">Finish</button></div></div>';
}
function startTimer(mins){
  stopTimer();var end=Date.now()+mins*60000;
  function tick(){
    var el=document.getElementById("timer");
    if(!el||S.view!=="write"){stopTimer();return;}
    var left=Math.max(0,Math.round((end-Date.now())/1000));
    el.textContent=left>0?Math.floor(left/60)+":"+String(left%60).padStart(2,"0")+" left":"Time’s up. Finish your sentence, then check your work.";
    if(left<=0)stopTimer();
  }
  tick();timerId=setInterval(tick,1000);
}
function writeDone(){
  var w=COURSE[S.day-1].write,ticks=load("satsp-ticks-"+S.day,[]);
  var n=w.check.filter(function(c,i){return ticks[i];}).length;
  stopTimer();cSave(S.day,{write:{ticks:n,total:w.check.length}});dayScreen(S.day);
}

function courseTile(){
  var cur=currentDay();
  if(cur>30)return '<button class="tile course" data-act="course-all"><span class="sym">✓</span><span class="big">30-day course complete</span><span>Tap to look back at any day.</span></button>';
  return '<button class="tile course" data-act="course"><span class="sym">Day '+cur+'</span><span class="big">'+esc(COURSE[cur-1].t)+'</span><span>Today’s course: maths, writing structure and a short piece of writing. About 15 to 20 minutes.</span></button>';
}

/* ---------- events ---------- */
app.addEventListener("click",function(e){
  var k=e.target.closest("[data-key]");
  if(k){arithKey(k.dataset.key);return;}
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.dataset.act;
  if(a==="home"){stopTimer();home();}
  else if(a==="course")courseOpen();
  else if(a==="course-all")courseAll();
  else if(a==="day")dayScreen(+el.dataset.n);
  else if(a==="c-maths")courseMathsStart(+el.dataset.n);
  else if(a==="c-try")tryStart(+el.dataset.n);
  else if(a==="c-write")writeStart(+el.dataset.n);
  else if(a==="try-next")tryNext();
  else if(a==="mc"){if(S.answered)return;S.chose=+el.dataset.o;S.answered=true;if(S.chose===0)S.right++;tryDraw();}
  else if(a==="ord"){if(S.answered)return;var pi=+el.dataset.p;if(S.seq.indexOf(pi)<0)S.seq.push(pi);tryDraw();}
  else if(a==="ord-reset"){S.seq=[];tryDraw();}
  else if(a==="ord-check"){if(S.seq.length<TEXTS[COURSE[S.day-1].tasks[S.i].id].p.length)return;S.answered=true;if(S.seq.every(function(v,i){return v===i;}))S.right++;tryDraw();}
  else if(a==="timer")startTimer(+el.dataset.m);
  else if(a==="write-done")writeDone();
  else if(a==="arith-setup")arithSetup();
  else if(a==="chip"){
    var g=el.dataset.g,i=chosen.indexOf(g);
    if(i>=0){if(chosen.length>1)chosen.splice(i,1);}else chosen.push(g);
    store("satsp-groups-v1",chosen);
    el.setAttribute("aria-pressed",String(chosen.indexOf(g)>=0));
  }
  else if(a==="level"){curLevel=+el.dataset.l;store("satsp-level-v1",curLevel);arithSetup();}
  else if(a==="arith-go")arithStart(+el.dataset.n);
  else if(a==="arith-redo")arithStart(Math.max(10,S.redo.length*3),S.redo);
  else if(a==="spell-setup")spellSetup();
  else if(a==="spell-go")spellStart();
  else if(a==="hear"){var w=S.items[S.i];say(w[1]?[w[0],w[1],w[0]]:[w[0],w[0]]);var i2=document.getElementById("sp");if(i2&&!S.checked)i2.focus();}
  else if(a==="hear-word"){say([S.items[S.i][0]]);}
  else if(a==="spell-check")spellCheck();
  else if(a==="extra-save"){
    var list=document.getElementById("extra").value.split(/[,\n]/).map(function(s){return s.trim().toLowerCase();})
      .filter(function(s){return /^[a-z][a-z' -]*$/.test(s);});
    var known=WORDS.map(function(w){return w[0];});
    list=list.filter(function(s,i){return list.indexOf(s)===i&&known.indexOf(s)<0;});
    store(KEY_EXTRA,list);
    document.getElementById("exmsg").textContent=list.length?"Saved "+list.length+" word"+(list.length===1?"":"s")+".":"Saved.";
  }
});
app.addEventListener("input",function(e){
  var t=e.target;
  if(S.view==="write"&&t.dataset.plan!==undefined){var pl=load("satsp-plan-"+S.day,[]);pl[+t.dataset.plan]=t.value;store("satsp-plan-"+S.day,pl);}
});
app.addEventListener("change",function(e){
  var t=e.target;
  if(S.view==="write"&&t.dataset.tick!==undefined){var tk=load("satsp-ticks-"+S.day,[]);tk[+t.dataset.tick]=t.checked;store("satsp-ticks-"+S.day,tk);}
});
document.addEventListener("keydown",function(e){
  if(S.view==="arith"){
    if(/^[0-9.\/ -]$/.test(e.key)){e.preventDefault();arithKey(e.key);}
    else if(e.key==="Backspace"){e.preventDefault();arithKey("back");}
    else if(e.key==="Enter"){e.preventDefault();arithKey("enter");}
  } else if(S.view==="spell"&&e.key==="Enter"){e.preventDefault();spellCheck();}
});

home();
